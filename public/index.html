<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OW2 실시간 조합 분석 & 추천</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: #0d121a;
      color: #eef3f9;
      padding: 18px;
    }
    .wrap { max-width: 1120px; margin: 0 auto; display: grid; gap: 14px; }
    .card {
      background: #151e2c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 16px;
    }
    h1, h2 { margin: 0 0 10px 0; font-size: 16px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    input, select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0d121a;
      color: #fff;
      font-size: 13px;
    }
    button {
      background: #ff9c1a;
      color: #0d121a;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #243248;
      color: #eef3f9;
    }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
    .rec-item {
      background: #0d121a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .rec-top { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 4px; }
    .muted { color: #9ab0c9; font-size: 12px; }
    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 156, 26, 0.16);
      color: #ffb84d;
      font-size: 12px;
      margin: 2px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>OW2 실시간 조합 분석 & 추천</h1>
      <div class="row" style="margin-bottom: 10px;">
        <label class="muted">내 닉네임:</label>
        <input id="nicknameInput" type="text" placeholder="게임 내 닉네임 입력" />
        <button onclick="saveNickname()">닉네임 저장</button>
        <span id="nicknameStatus" class="muted"></span>
      </div>
      <div class="row">
        <label class="muted">내 영웅 직접 지정:</label>
        <select id="myHeroSelect" onchange="changeMyHero()">
          <option value="">선택 안 함</option>
        </select>
        <span id="currentMyHeroText" class="tag">현재 내 영웅: 미지정</span>
        <button class="secondary" onclick="resetState()">상태 초기화</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <h2>아군 / 적군 현황</h2>
        <div style="margin-bottom: 8px;">
          <div class="muted">아군</div>
          <div id="alliesList">-</div>
        </div>
        <div>
          <div class="muted">적군</div>
          <div id="enemiesList">-</div>
        </div>
      </div>

      <div class="card">
        <h2>내 역할군 추천</h2>
        <div id="swapList">데이터 대기 중...</div>
      </div>
    </div>

    <div class="card">
      <h2>역할군별 TOP 3 추천</h2>
      <div class="grid-2">
        <div>
          <div class="muted" style="margin-bottom:6px;">탱커</div>
          <div id="topTank">-</div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:6px;">딜러</div>
          <div id="topDps">-</div>
        </div>
        <div>
          <div class="muted" style="margin-bottom:6px;">힐러</div>
          <div id="topSupport">-</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let heroesMap = {};
    let nicknameInitialized = false;

    function renderHeroOptions(heroes) {
      const select = document.getElementById("myHeroSelect");
      const prevVal = select.value;
      select.innerHTML = '<option value="">선택 안 함</option>';
      Object.entries(heroes)
        .sort((a, b) => a[1].koName.localeCompare(b[1].koName, "ko"))
        .forEach(([id, info]) => {
          const opt = document.createElement("option");
          opt.value = id;
          opt.textContent = `${info.koName} (${info.compKo})`;
          select.appendChild(opt);
        });
      if (prevVal) select.value = prevVal;
    }

    function renderRecList(targetId, items) {
      const el = document.getElementById(targetId);
      if (!items || items.length === 0) {
        el.innerHTML = '<div class="muted">추천 데이터 없음</div>';
        return;
      }
      el.innerHTML = items
        .map(
          (item) => `
          <div class="rec-item">
            <div class="rec-top">
              <span>${item.name}</span>
              <span>${item.score}점</span>
            </div>
            <div class="muted">${item.reason}</div>
          </div>`
        )
        .join("");
    }

    function applyState(data) {
      if (data.heroes && Object.keys(heroesMap).length === 0) {
        heroesMap = data.heroes;
        renderHeroOptions(heroesMap);
      }

      const nickInput = document.getElementById("nicknameInput");
      if (!nicknameInitialized && document.activeElement !== nickInput) {
        nickInput.value = data.nickname || "";
        nicknameInitialized = true;
      }
      document.getElementById("nicknameStatus").textContent = data.nickname
        ? `등록된 닉네임: "${data.nickname}"`
        : "미등록";

      const myHeroSelect = document.getElementById("myHeroSelect");
      if (data.myHero && myHeroSelect.value !== data.myHero) {
        myHeroSelect.value = data.myHero;
      }
      const myHeroName = data.myHero && heroesMap[data.myHero] ? heroesMap[data.myHero].koName : "미지정";
      document.getElementById("currentMyHeroText").textContent = `현재 내 영웅: ${myHeroName}`;

      document.getElementById("alliesList").innerHTML =
        (data.allies && data.allies.length
          ? data.allies.map((id) => `<span class="tag">${heroesMap[id] ? heroesMap[id].koName : id}</span>`).join("")
          : '<span class="muted">인식된 아군 없음</span>');

      document.getElementById("enemiesList").innerHTML =
        (data.enemies && data.enemies.length
          ? data.enemies.map((id) => `<span class="tag">${heroesMap[id] ? heroesMap[id].koName : id}</span>`).join("")
          : '<span class="muted">인식된 적군 없음</span>');

      if (data.recommendations) {
        renderRecList("swapList", data.recommendations.swapRecommendations);
        renderRecList("topTank", data.recommendations.topByRole.tank);
        renderRecList("topDps", data.recommendations.topByRole.dps);
        renderRecList("topSupport", data.recommendations.topByRole.support);
      }
    }

    async function saveNickname() {
      const val = document.getElementById("nicknameInput").value.trim();
      const resp = await fetch("/api/nickname", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nickname: val })
      });
      const resJson = await resp.json();
      if (resJson.ok) {
        document.getElementById("nicknameStatus").textContent = resJson.nickname
          ? `저장됨: "${resJson.nickname}"`
          : "닉네임 삭제됨";
      }
    }

    async function changeMyHero() {
      const val = document.getElementById("myHeroSelect").value;
      await fetch("/api/my-hero", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ myHero: val || null })
      });
    }

    async function resetState() {
      await fetch("/api/reset", { method: "POST" });
    }

    const evtSource = new EventSource("/events");
    evtSource.onmessage = (event) => {
      try {
        applyState(JSON.parse(event.data));
      } catch (e) {}
    };
  </script>
</body>
</html>
